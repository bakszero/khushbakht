<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>You’re invited</title>
<script>
/* an address typed with capitals (phones like to capitalise) is tried again in small letters; any other address on
   this site leads to the invitation, keeping the private part of the link (after #) */
var p = location.pathname, low = p.toLowerCase();
location.replace((p !== low ? low.replace(/\/*$/, "/") : "/") + location.hash);
</script>
<style>
html, body { height: 100%; margin: 0; }
body { display: grid; place-items: center; background: #EFE8DC; color: #5A4326; font: 18px/1.6 Georgia, "Times New Roman", serif; text-align: center; }
a { color: #8A6628; }
</style>
</head>
<body>
<p><a href="/">Open the invitation</a></p>
</body>
</html>
