<body>
<p id="msg" hidden>This invitation link isn’t quite right.<br>Please ask the family for a fresh one.</p>
<script>
(async function () {
  var W = { s: "AInV88XIk8TrNJpBt+nNTQ==", i: "iZsQeFPk5kHHxEI6", c: "6NAx/faPgyftzmyIPeFOygvXQ7cAeNprODIEYVyso2hBy9p+KjQ=", n: 200000 };
  function bytes(s) { var b = atob(s), a = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) a[i] = b.charCodeAt(i); return a; }
  try {
    // the word is this page's own address; it opens the invitation's real key, which is never published in the clear
    var word = decodeURIComponent(location.pathname).replace(/^\/+|\/+$/g, "").split("/").pop().toLowerCase();
    var base = await crypto.subtle.importKey("raw", new TextEncoder().encode(word), "PBKDF2", false, ["deriveKey"]);
    var kek = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: bytes(W.s), iterations: W.n, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    var key = new TextDecoder().decode(await crypto.subtle.decrypt({ name: "AES-GCM", iv: bytes(W.i) }, kek, bytes(W.c)));
    var guest = location.hash.length > 1 ? "/" + location.hash.slice(1) : "";
    location.replace("../?w=" + encodeURIComponent(word) + "#" + key + guest);     // the invitation puts this short address back in the bar
  } catch (e) { document.getElementById("msg").hidden = false; }
})();
</script>
